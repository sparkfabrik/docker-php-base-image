; gRPC settings. PHP reads them only once an ini file loads the extension
; (extension=grpc); until then they are ignored. To change them, set them in
; an ini file that sorts after this one in conf.d (for example zz-project.ini).
;
; With fork support a child forked after the parent opened a gRPC channel fails
; with an exception instead of hanging on a gRPC lock; fork before opening a
; channel. Fork support needs the epoll1 or poll strategy.
grpc.enable_fork_support=1
grpc.poll_strategy=epoll1
